<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a3a20">
<meta name="robots" content="noindex,nofollow">
<title>האוצר של נועם ויותם</title>
<style>
  :root{
    --sand:#f3e8d2; --sand-2:#e8d9b9; --card:#fffaf0; --ink:#2a2018; --muted:#6f6048;
    --clay:#a8482a; --clay-d:#8a3a20; --olive:#55662f; --err:#b3261e; --line:#d8c7a3;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Heebo","Assistant","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    background:radial-gradient(circle at 15% 0%, #fbf3e1 0, transparent 45%), var(--sand);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:480px; margin:0 auto; padding:16px 16px 48px}
  header{margin-bottom:12px}
  .brand{font-weight:800; color:var(--clay-d); font-size:1rem; margin-bottom:8px}
  .bar{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
  .pill{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:.92rem; font-weight:600}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:16px;
    box-shadow:0 2px 0 var(--sand-2), 0 10px 24px -14px rgba(60,40,10,.35);
  }
  h1{font-size:1.5rem; line-height:1.3; margin:0 0 12px}
  h2{font-size:1.15rem; margin:18px 0 6px}
  p{line-height:1.65; margin:0 0 12px; font-size:1.05rem}
  .muted{color:var(--muted); font-size:.95rem}
  label.field{display:block; font-weight:700; margin:16px 0 8px; font-size:1.05rem}
  input[type=text],input[type=number],input[type=tel]{
    width:100%; font:inherit; font-size:1.2rem; padding:13px 14px; color:var(--ink);
    border:2px solid var(--line); border-radius:14px; background:#fff;
  }
  input:focus{outline:3px solid #e9b9a6; border-color:var(--clay)}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:54px;
    padding:12px 16px; border:0; border-radius:14px; margin-top:14px;
    font:inherit; font-weight:800; font-size:1.1rem; cursor:pointer; background:var(--clay); color:#fff;
    text-align:center; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .btn:active{background:var(--clay-d)}
  .btn[disabled]{opacity:.55; cursor:not-allowed}
  .btn.alt{background:#fff; color:var(--clay-d); border:2px solid var(--clay)}
  .linkbtn{all:unset; display:inline-block; color:var(--clay-d); font-weight:700; text-decoration:underline; cursor:pointer; padding:10px 0; min-height:44px}
  .msg{min-height:1.5em; margin:10px 0 0; font-weight:700; line-height:1.5}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--olive)}
  .progress{height:8px; background:var(--sand-2); border-radius:99px; overflow:hidden; margin-top:10px}
  .progress > i{display:block; height:100%; width:0; background:var(--olive); transition:width .2s}
  .preview{display:block; width:100%; max-height:42vh; object-fit:contain; border-radius:12px; background:#efe3c8; margin:12px 0 0}
  .zoomable{display:block; width:100%; border-radius:12px; background:#efe3c8; cursor:zoom-in}
  .tick{color:var(--olive); font-weight:800}
  .legend{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0}
  .legend.big{grid-template-columns:repeat(3,1fr); gap:10px}
  .lg{background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 2px; text-align:center}
  .lg svg{display:block; width:100%; height:auto; max-height:64px; padding:4px 10px}
  .lg b{display:block; font-size:1.1rem; padding-bottom:2px}
  .digits{display:flex; gap:10px; direction:rtl; margin:8px 0}
  .digits > div{flex:1; text-align:center}
  .digits label{display:block; font-weight:700; margin-bottom:6px}
  .digits input{text-align:center; font-size:1.8rem; padding:12px 2px}
  .digits label{font-size:.9rem}
  .lightbox{position:fixed; inset:0; z-index:50; background:rgba(20,12,4,.92); overflow:auto; -webkit-overflow-scrolling:touch; padding:56px 12px 24px}
  .lightbox .close{position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px; z-index:51; min-height:44px; width:auto; padding:8px 18px; margin:0}
  .lightbox img{display:block; width:100%; max-width:900px; margin:0 auto; border-radius:8px}
  .lightbox .sheet{background:var(--card); border-radius:14px; padding:12px; max-width:700px; margin:0 auto}
  .banner{background:#fff3c4; border:1px solid #e3c65a; color:#5a4500; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-weight:700; line-height:1.5}
  .over{position:fixed; inset:0; z-index:60; background:rgba(42,32,24,.94); display:flex; align-items:center; justify-content:center; padding:20px}
  .over .card{max-width:420px; margin:0; text-align:center}
  .hidden{display:none !important}
  .note{background:#f6f8ea; border:1px dashed var(--olive); border-radius:14px; padding:12px 14px; margin:14px 0}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🗝 האוצר של נועם ויותם</div>
    <div class="bar hidden" id="bar"><span class="pill" id="teamPill"></span><span class="pill" id="stepPill"></span></div>
  </header>
  <div class="banner hidden" id="endBanner" role="status"></div>
  <main id="app" aria-live="polite"></main>
</div>
<div id="lb" class="lightbox hidden" role="dialog" aria-modal="true"></div>
<div id="over" class="over hidden" role="alertdialog" aria-modal="true"></div>

<script src="config.js"></script>
<script src="paleo.js"></script>
<script>
(function () {
  "use strict";

  var CFG = window.CONFIG || {};
  var BASE = (CFG.SUPABASE_URL || "").replace(/\/+$/, "");
  var KEY = CFG.SUPABASE_KEY || "";
  var app = document.getElementById("app");
  var SCAN = (new URLSearchParams(location.search).get("s") || "").toLowerCase() === "siblings";
  var WCODE = new URLSearchParams(location.search).get("w") || "";
  var POLL_MS = CFG.POLL_MS || 30000;
  var LS = "th_auth_v2";

  var auth = null;      // {table, token, upload_key}
  var S = null;         // מצב הקבוצה מהשרת
  var view = null;      // מסך זמני (מסכי "הצלחה" ורישום)
  var memAuth = null;

  // ---------- עזרים ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement("div"); d.textContent = (s == null ? "" : String(s)); return d.innerHTML; }
  function rand(){ return Math.random().toString(36).slice(2, 8); }

  function loadAuth(){
    var raw = null;
    try { raw = localStorage.getItem(LS); } catch (e) {}
    if (!raw) { try { raw = sessionStorage.getItem(LS); } catch (e) {} }
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return memAuth;
  }
  function saveAuth(a){
    memAuth = a;
    var raw = a ? JSON.stringify(a) : null;
    try { raw ? localStorage.setItem(LS, raw) : localStorage.removeItem(LS); } catch (e) {}
    try { raw ? sessionStorage.setItem(LS, raw) : sessionStorage.removeItem(LS); } catch (e) {}
  }

  // ---------- שרת ----------
  function headers(json){
    var h = { "apikey": KEY };
    if (/^eyJ/.test(KEY)) h["Authorization"] = "Bearer " + KEY;
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function rpc(name, args){
    return fetch(BASE + "/rest/v1/rpc/" + name, { method: "POST", headers: headers(true), body: JSON.stringify(args || {}) })
      .then(function (r) {
        return r.text().then(function (t) {
          var data = null; try { data = t ? JSON.parse(t) : null; } catch (e) {}
          if (!r.ok) {
            var e = new Error((data && (data.message || data.hint)) || ("HTTP " + r.status));
            e.code = (data && data.message) || ""; e.status = r.status; throw e;
          }
          return data;
        });
      }, function () { var e = new Error("network"); e.code = "network"; throw e; });
  }
  function uploadFile(path, blob, onProgress){
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open("POST", BASE + "/storage/v1/object/photos/" + path);
      var h = headers(false); for (var k in h) x.setRequestHeader(k, h[k]);
      x.setRequestHeader("Content-Type", blob.type || "image/jpeg");
      x.setRequestHeader("x-upsert", "false");
      x.timeout = 120000;
      x.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = function () { (x.status >= 200 && x.status < 300) ? resolve() : reject(new Error("upload " + x.status)); };
      x.onerror = function () { reject(new Error("network")); };
      x.ontimeout = function () { reject(new Error("timeout")); };
      x.send(blob);
    });
  }
  function call(name, extra){
    var a = { p_table: auth.table, p_token: auth.token };
    for (var k in extra) a[k] = extra[k];
    return rpc(name, a);
  }

  // ---------- כיווץ תמונה ----------
  function compress(file){
    var MAX = 1600;
    function fromBitmap(bmp){
      var w = bmp.width, h = bmp.height, sc = Math.min(1, MAX / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function (res, rej) { c.toBlob(function (b) { b ? res(b) : rej(new Error("toBlob")); }, "image/jpeg", 0.82); });
    }
    var p;
    if (window.createImageBitmap) {
      p = createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () { return createImageBitmap(file); }).then(fromBitmap);
    } else {
      p = new Promise(function (res, rej) {
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function () { fromBitmap(img).then(function (b) { URL.revokeObjectURL(url); res(b); }, rej); };
        img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("decode")); };
        img.src = url;
      });
    }
    return p.catch(function () { if (file.size <= 8 * 1024 * 1024) return file; throw new Error("too_big"); });
  }

  // ---------- חלקי מסך ----------
  function msg(id){ return '<p class="msg" id="' + id + '" role="status" aria-live="polite"></p>'; }
  function setMsg(id, t, kind){ var m = $(id); if (!m) return; m.textContent = t || ""; m.className = "msg" + (kind ? " " + kind : ""); }
  function netMsg(e){
    if (e && e.code === "unauthorized") return null;
    return "אין חיבור יציב לאינטרנט. בדקו את החיבור ונסו שוב.";
  }
  function stepOf(stage){ return stage <= 1 ? 1 : (stage === 2 ? 2 : (stage <= 4 ? 3 : 4)); }

  function header(){
    var bar = $("bar");
    if (!S) { bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden");
    $("teamPill").textContent = "שולחן " + S.table_no + (S.team_name ? " · " + S.team_name : "");
    var sp = $("stepPill");
    if (S.stage >= 6) { sp.classList.add("hidden"); }
    else { sp.classList.remove("hidden"); sp.textContent = "משימה " + stepOf(S.stage) + " מתוך 4"; }
  }

  function render(){
    header();
    if (!S) { return view === "register" ? renderRegister() : renderWelcome(); }
    if (view === "solved1") return renderSolved1();
    if (view === "solved3") return renderSolved3();
    switch (S.stage) {
      case 0: return renderTask1();
      case 1: return renderTask2();
      case 2: return renderTask2Done();
      case 3: return renderTattooId();
      case 4: return renderTattooPhoto();
      case 5: return renderPhotos();
      default: return renderBox();
    }
    window.scrollTo(0, 0);
  }
  function show(html){ app.innerHTML = html; window.scrollTo(0, 0); }

  // ---------- מסך 1: פתיחה ----------
  function renderWelcome(){
    show(
      '<section class="card">' +
        '<h1>האוצר של נועם ויותם</h1>' +
        '<p><strong>ברוכים הבאים לחפש את המטמון של החתונה שלנו!</strong></p>' +
        '<p>בין האוכל לחופה, אנחנו מזמינים אתכם לצאת למסע קטן בעקבותינו. בדרך תענו על שאלות, תפענחו רמזים ותשלימו משימות ברחבי המתחם.</p>' +
        '<p>כל שולחן הוא קבוצה. שתפו פעולה — יכול להיות שמישהו אצלכם יודע בדיוק את מה שחסר לאחרים.</p>' +
        '<p>הקבוצה הראשונה שתשלים את המסלול ותפתח את האוצר תזכה בפרס שווה במיוחד!</p>' +
        '<p>בחרו טלפון אחד שילווה את הקבוצה, ושמרו את המעטפה ואת הדפים איתכם לאורך הדרך.</p>' +
        '<button class="btn" id="startBtn" type="button">מתחילים</button>' +
      '</section>');
    $("startBtn").onclick = function () { view = "register"; render(); };
  }

  // ---------- מסך 2: רישום ----------
  var regVals = { table: "", name: "" };
  function renderRegister(){
    show(
      '<section class="card">' +
        '<h1>איזה שולחן אתם?</h1>' +
        '<p>הזינו את מספר השולחן שלכם. ואם מתחשק לכם, תנו גם שם לקבוצה.</p>' +
        '<label class="field" for="tn">מספר השולחן</label>' +
        '<input id="tn" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="300" placeholder="למשל: 7" autocomplete="off" value="' + esc(regVals.table) + '">' +
        '<label class="field" for="tm">שם הקבוצה (לא חובה)</label>' +
        '<input id="tm" type="text" maxlength="40" placeholder="איך קוראים לצוות שלכם?" autocomplete="off" value="' + esc(regVals.name) + '">' +
        msg("regMsg") +
        '<button class="btn" id="regBtn" type="button">למשימה הראשונה</button>' +
      '</section>');
    $("tn").oninput = function () { regVals.table = this.value; };
    $("tm").oninput = function () { regVals.name = this.value; };
    $("regBtn").onclick = function () {
      var n = parseInt($("tn").value, 10);
      if (!n || n < 1 || n > 300) { setMsg("regMsg", "הזינו מספר שולחן כדי להתחיל.", "err"); return; }
      var btn = this; btn.disabled = true; setMsg("regMsg", "רגע…");
      var old = loadAuth();
      rpc("register_team", { p_table: n, p_name: $("tm").value, p_token: (old && old.table === n) ? old.token : null })
        .then(function (r) {
          auth = { table: n, token: r.token, upload_key: r.upload_key };
          saveAuth(auth); S = r.state; view = null; render();
        })
        .catch(function (e) {
          btn.disabled = false;
          if (e.code === "table_taken") setMsg("regMsg", "השולחן הזה כבר רשום בטלפון אחר. אם הזנתם מספר שגוי, תקנו אותו. אם זה השולחן שלכם, המשיכו עם הטלפון שבו התחלתם, או פנו אלינו.", "err");
          else setMsg("regMsg", netMsg(e), "err");
        });
    };
  }

  // ---------- עזר לשליחת תשובת טקסט ----------
  function answerBlock(o){
    return '<label class="field" for="' + o.id + '">' + o.label + '</label>' +
      '<input id="' + o.id + '" type="text" autocomplete="off" autocapitalize="off" placeholder="' + o.ph + '">' +
      msg(o.id + "Msg") +
      '<button class="btn" id="' + o.id + 'Btn" type="button">בדיקת תשובה</button>';
  }
  function bindAnswer(o){
    var inp = $(o.id), btn = $(o.id + "Btn");
    function go(){
      if (btn.disabled) return;
      if (!inp.value.trim()) { setMsg(o.id + "Msg", o.empty, "err"); return; }
      btn.disabled = true; setMsg(o.id + "Msg", "בודקים…");
      call("submit_answer", { p_task: o.task, p_answer: inp.value }).then(function (r) {
        S = r.state;
        if (r.ok) { view = o.after || null; render(); }
        else { btn.disabled = false; setMsg(o.id + "Msg", o.wrong, "err"); }
      }).catch(function (e) { btn.disabled = false; handleErr(e, o.id + "Msg"); });
    }
    btn.onclick = go;
    inp.onkeydown = function (e) { if (e.key === "Enter") go(); };
  }
  function handleErr(e, msgId){
    if (e && e.code === "unauthorized") {
      saveAuth(null); auth = null; S = null; view = "register";
      render();
      setMsg("regMsg", "הרישום של הקבוצה נמחק. הזינו שוב את מספר השולחן.", "err");
      return;
    }
    if (e && e.code === "locked") { refresh(); return; }
    setMsg(msgId, netMsg(e), "err");
  }
  function refresh(){
    if (!auth) { render(); return Promise.resolve(); }
    return call("get_state", {}).then(function (s) { S = s; render(); }, function (e) {
      if (e && e.code === "unauthorized") handleErr(e, "regMsg");
    });
  }

  // ---------- משימה 1 ----------
  function renderTask1(){
    show(
      '<section class="card">' +
        '<h1>משימה 1 — כמה אתם מכירים אותנו?</h1>' +
        '<p>פתחו את המעטפה שעל השולחן והוציאו את השאלון.</p>' +
        '<p>ליד כל תשובה מופיעה אות. בחרו את התשובה הנכונה בכל שאלה, ואספו את האותיות לפי סדר השאלות.</p>' +
        '<p>חברו את האותיות כדי לגלות לאן ממשיכים.</p>' +
        '<p>פענחתם? כתבו כאן את המקום שקיבלתם.</p>' +
        answerBlock({ id: "a1", label: "לאן ממשיכים?", ph: "הקלידו את הפתרון שלכם" }) +
        '<button class="linkbtn" id="wrongTable" type="button">טעיתם במספר השולחן? לתיקון</button>' +
      '</section>');
    bindAnswer({ id: "a1", task: "task1", empty: "כתבו את הפתרון לפני הבדיקה.",
      wrong: "עוד לא… בדקו שוב את התשובות ואת סדר האותיות ונסו מחדש.", after: "solved1" });
    $("wrongTable").onclick = function () {
      if (!confirm("לתקן את מספר השולחן?")) return;
      call("unregister_team", {}).then(function () {
        saveAuth(null); auth = null; S = null; view = "register"; render();
      }).catch(function (e) { handleErr(e, "a1Msg"); });
    };
  }
  function renderSolved1(){
    show(
      '<section class="card">' +
        '<h1>פענחתם!</h1>' +
        '<p>התחנה הבאה שלכם היא הבר הפנימי.</p>' +
        '<button class="btn" id="go" type="button">למשימה בבר הפנימי</button>' +
      '</section>');
    $("go").onclick = function () { view = null; render(); };
  }

  // ---------- משימה 2 ----------
  function legendHtml(big){
    var P = window.PALEO; if (!P) return "";
    var order = "אבגדהוזחטיכלמנסעפצקרשת".split("");
    return '<div class="legend' + (big ? " big" : "") + '" dir="rtl">' + order.map(function (ch) {
      var label = ch === "מ" ? "מ · ם" : ch;
      return '<div class="lg"><svg viewBox="0 0 ' + P.w + " " + P.h + '" aria-hidden="true"><path d="' + P.g[ch] + '" fill="#2a2018"/></svg><b>' + label + '</b></div>';
    }).join("") + '</div>';
  }
  function openLightbox(inner){
    var lb = $("lb");
    lb.innerHTML = '<button class="btn close" type="button" id="lbClose">סגירה</button>' + inner;
    lb.classList.remove("hidden");
    $("lbClose").onclick = function () { lb.classList.add("hidden"); lb.innerHTML = ""; };
  }
  function renderTask2(){
    show(
      '<section class="card">' +
        '<h1>משימה 2 — מסר מהעבר</h1>' +
        '<p>גשו לבר הפנימי וחפשו את השלט עם הכתובת בכתב העברי הקדום.</p>' +
        '<p>היעזרו במקרא האותיות שכאן כדי לפענח את הכתובת. זכרו לקרוא מימין לשמאל.</p>' +
        '<h2>מקרא האותיות</h2>' +
        legendHtml(false) +
        '<p class="muted">האות הקדומה של מ׳ משמשת גם לצורה הסופית ם. האותיות הסופיות האחרות (ך, ן, ף, ץ) נכתבות כמו האות הרגילה.</p>' +
        '<button class="btn alt" id="zoomLg" type="button">🔍 הגדלת המקרא</button>' +
        '<h2>מה כתוב שם?</h2>' +
        answerBlock({ id: "a2", label: "מה המילה שפענחתם?", ph: "הקלידו את המילה" }) +
      '</section>');
    $("zoomLg").onclick = function () { openLightbox('<div class="sheet">' + legendHtml(true) + '<p class="muted">האות הקדומה של מ׳ משמשת גם לצורה הסופית ם.</p></div>'); };
    bindAnswer({ id: "a2", task: "task2", empty: "כתבו את המילה שפענחתם לפני הבדיקה.",
      wrong: "עוד לא… הסתכלו שוב במקרא ובדקו כל אות. זכרו לקרוא מימין לשמאל." });
  }
  function renderTask2Done(){
    show(
      '<section class="card">' +
        '<h1>פענחתם את המסר!</h1>' +
        '<p><strong>הרמז הבא נמצא אצל האחים והאחיות שלנו.</strong></p>' +
        '<p>מצאו את תום או גל, האחים של נועם, או את ליה או נויה, האחיות של יותם.</p>' +
        '<p>מספיק למצוא אחד מהם. סרקו את הברקוד שאצלם כדי לפתוח את המשימה הבאה.</p>' +
      '</section>');
  }

  // ---------- סריקת הברקוד של האחים ----------
  function renderTooEarly(){
    show(
      '<section class="card">' +
        '<h1>עוד לא הגעתם לשלב הזה</h1>' +
        '<p>עוד לא הגעתם לשלב הזה. השלימו קודם את המשימה הנוכחית שלכם.</p>' +
        '<button class="btn" id="back" type="button">חזרה למשימה שלי</button>' +
      '</section>');
    $("back").onclick = function () { view = null; render(); };
  }
  function renderNeedsStart(){
    show(
      '<section class="card">' +
        '<h1>עוד לא התחלתם</h1>' +
        '<p>כדי להשתתף, התחילו מהברקוד שעל המעטפה שעל השולחן שלכם.</p>' +
      '</section>');
  }

  // ---------- משימה 3 א ----------
  function renderTattooId(){
    var img = S.closeup
      ? '<img class="zoomable" id="closeup" alt="תמונת תקריב" src="' + esc(S.closeup) + '">' +
        '<p class="muted">לחצו על התמונה כדי להגדיל.</p>'
      : '<p class="note">תמונת התקריב עדיין לא הועלתה.</p>';
    show(
      '<section class="card">' +
        '<h1>משימה 3 — מזהים מקרוב</h1>' +
        '<p>לפעמים צריך להסתכל על הפרטים הקטנים כדי להבין את התמונה הגדולה.</p>' +
        '<p>זהו את המקום שבתצלום והגיעו אליו.</p>' +
        '<p><strong>מה יש בעמדה שמצאתם?</strong></p>' +
        img +
        answerBlock({ id: "a3", label: "מה יש בעמדה?", ph: "הקלידו את התשובה" }) +
      '</section>');
    var c = $("closeup");
    if (c) c.onclick = function () { openLightbox('<img alt="תמונת תקריב" src="' + esc(S.closeup) + '">'); };
    bindAnswer({ id: "a3", task: "tattoo_id", empty: "כתבו מה יש בעמדה כדי להמשיך.",
      wrong: "עוד לא… הסתכלו שוב בתמונה וחפשו את העמדה המתאימה." });
  }

  // ---------- משימה 3 ב ----------
  var pick = { blob: null, path: null };
  function renderTattooPhoto(){
    var photoSaved = !!S.photo_saved, codeOk = !!S.code_ok;
    show(
      '<section class="card">' +
        '<h1>משימה 3 — השאירו סימן</h1>' +
        '<h2>הידעתם?</h2>' +
        '<p>נועם התחילה את דרכה כעצמאית כחוקרת ומרצה על עולם הקעקועים הקדום. עכשיו תורכם להשאיר סימן!</p>' +
        '<h2>המשימה שלכם</h2>' +
        '<p>עשו קעקוע חדש בעמדה — גם אם כבר עשיתם אחד קודם!</p>' +
        '<p>צלמו את הקעקוע החדש והעלו את התמונה כאן.</p>' +
        '<p>אי־שם בעמדה מסתתר קוד. מצאו אותו והקלידו אותו כדי להמשיך.</p>' +
        (photoSaved
          ? '<p class="tick">✓ התמונה נשמרה</p>'
          : '<label class="btn alt" for="file" id="pickBtn">📷 צילום או העלאת תמונה</label>' +
            '<input id="file" type="file" accept="image/*">' +
            '<img id="pv" class="preview hidden" alt="תצוגה מקדימה של התמונה שנבחרה">' +
            '<button class="linkbtn hidden" id="swap" type="button">החלפת תמונה</button>' +
            '<p class="muted">התמונה תישמר עבור נועם ויותם.</p>') +
        (codeOk
          ? '<p class="tick">✓ הקוד אושר</p>'
          : '<label class="field" for="code">מה הקוד שמצאתם?</label>' +
            '<input id="code" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="הקלידו את הקוד">') +
        '<div class="progress hidden" id="prog"><i id="progI"></i></div>' +
        msg("tMsg") +
        '<button class="btn" id="tSend" type="button">שליחה ובדיקת הקוד</button>' +
      '</section>');

    if (!photoSaved) {
      if (pick.blob) { var pv0 = $("pv"); pv0.src = URL.createObjectURL(pick.blob); pv0.classList.remove("hidden"); $("swap").classList.remove("hidden"); }
      $("file").onchange = function (e) {
        var f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
        setMsg("tMsg", "מכווצים את התמונה…");
        compress(f).then(function (b) {
          pick.blob = b; pick.path = null;
          var pv = $("pv"); pv.src = URL.createObjectURL(b); pv.classList.remove("hidden");
          $("swap").classList.remove("hidden"); setMsg("tMsg", "");
        }).catch(function () { setMsg("tMsg", "לא הצלחנו לקרוא את התמונה. נסו תמונה אחרת.", "err"); });
      };
      $("swap").onclick = function () { $("file").click(); };
    }

    var busy = false;
    $("tSend").onclick = function () {
      if (busy) return;
      var needPhoto = !S.photo_saved, needCode = !S.code_ok;
      var codeVal = needCode ? $("code").value.trim() : "";
      if (needPhoto && !pick.blob) { setMsg("tMsg", "העלו תמונה של הקעקוע החדש כדי להמשיך.", "err"); return; }
      if (needCode && !codeVal) { setMsg("tMsg", "הקלידו את הקוד שמצאתם בעמדה.", "err"); return; }
      busy = true; $("tSend").disabled = true; setMsg("tMsg", "");

      var failed = null;
      // 1) קוד. נשמר בשרת, כדי שלא יצטרכו להקליד אותו שוב אם ההעלאה תיכשל
      var step1 = needCode
        ? call("submit_tattoo_code", { p_code: codeVal }).then(function (r) { S = r.state; })
        : Promise.resolve();
      // 2) תמונה. נשמרת גם אם הקוד שגוי
      step1.then(function () {
        if (!needPhoto) return;
        setMsg("tMsg", "מעלים את התמונה… השאירו את הדף פתוח עד שמופיע אישור.");
        $("prog").classList.remove("hidden"); $("progI").style.width = "0";
        var p = pick.path ? Promise.resolve() : (function () {
          var path = auth.upload_key + "/" + Date.now() + "-" + rand() + ".jpg";
          return uploadFile(path, pick.blob, function (x) { $("progI").style.width = Math.round(x * 100) + "%"; })
            .then(function () { pick.path = path; });
        })();
        return p.then(function () { return call("register_photo", { p_path: pick.path }); })
          .then(function (s) { S = s; pick.blob = null; pick.path = null; })
          .catch(function (e) { failed = e; });
      }).then(function () {
        busy = false;
        if (S && S.stage >= 5) { view = "solved3"; render(); return; }
        // נשארים במסך, עם הודעה מתאימה
        var keepBlob = pick.blob, keepPath = pick.path;
        render();
        pick.blob = keepBlob; pick.path = keepPath;
        if (keepBlob) { var pv = $("pv"); if (pv) { pv.src = URL.createObjectURL(keepBlob); pv.classList.remove("hidden"); var sw = $("swap"); if (sw) sw.classList.remove("hidden"); } }
        if (failed) { setMsg("tMsg", "התמונה לא נשמרה. בדקו את החיבור לאינטרנט ונסו שוב.", "err"); }
        else if (!S.code_ok) { setMsg("tMsg", "זה עדיין לא הקוד הנכון. בדקו שוב ונסו מחדש.", "err"); }
      }).catch(function (e) {
        busy = false; $("tSend").disabled = false; $("prog").classList.add("hidden");
        handleErr(e, "tMsg");
      });
    };
  }
  function renderSolved3(){
    show(
      '<section class="card">' +
        '<h1>יש לכם סימן, ויש לכם קוד!</h1>' +
        '<button class="btn" id="go" type="button">למשימה הבאה</button>' +
      '</section>');
    $("go").onclick = function () { view = null; render(); };
  }

  // ---------- משימה 4 ----------
  function renderPhotos(){
    var d = S.digits || ["", "", "", ""];
    function f(i, label){
      return '<div><label for="d' + i + '">' + label + '</label>' +
        '<input id="d' + i + '" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" value="' + esc(d[i - 1] || "") + '"></div>';
    }
    show(
      '<section class="card">' +
        '<h1>משימה 4 — תמונות ומספרים</h1>' +
        '<p>תמונות שלנו מפוזרות ברחבי המתחם.</p>' +
        '<p>ליד ארבע מהן תמצאו אות וספרה. מצאו אותן ורשמו את הספרות לפי סדר האותיות: א׳, ב׳, ג׳, ד׳.</p>' +
        '<p>לא משנה באיזה סדר מצאתם אותן — מה שקובע הוא האות שליד כל תמונה.</p>' +
        '<div class="digits">' + f(1, "תמונה א׳") + f(2, "תמונה ב׳") + f(3, "תמונה ג׳") + f(4, "תמונה ד׳") + '</div>' +
        msg("fMsg") +
        '<button class="btn" id="fBtn" type="button">בדיקת הקוד</button>' +
      '</section>');
    [1, 2, 3, 4].forEach(function (i) {
      var el = $("d" + i);
      el.oninput = function () {
        this.value = this.value.replace(/[^0-9]/g, "").slice(-1);
        S.digits = S.digits || ["", "", "", ""]; S.digits[i - 1] = this.value;
        call("save_digit", { p_slot: i, p_digit: this.value }).catch(function () {});
        if (this.value && i < 4) $("d" + (i + 1)).focus();
      };
      el.onfocus = function () { this.select(); };
    });
    $("fBtn").onclick = function () {
      var btn = this, vals = [1, 2, 3, 4].map(function (i) { return $("d" + i).value; });
      if (vals.some(function (v) { return v === ""; })) { setMsg("fMsg", "עדיין חסר מספר. מצאו את התמונות ומלאו את כל השדות.", "err"); return; }
      btn.disabled = true; setMsg("fMsg", "בודקים…");
      call("submit_final", { p_digits: vals }).then(function (r) {
        if (r.ok) { S = r.state; render(); }
        else { btn.disabled = false; setMsg("fMsg", "משהו עדיין לא מסתדר… בדקו את הספרות ואת הסדר א׳, ב׳, ג׳, ד׳.", "err"); }
      }).catch(function (e) { btn.disabled = false; handleErr(e, "fMsg"); });
    };
  }

  // ---------- מיקום התיבה ----------
  function renderBox(){
    var where = (S.box_location && S.box_location.trim()) ? esc(S.box_location) : "(הרמז למיקום התיבה עדיין לא הוגדר)";
    show(
      '<section class="card">' +
        '<h1>האוצר קרוב מתמיד!</h1>' +
        '<p>' + where + '</p>' +
        '<p><strong>בהצלחה!</strong></p>' +
      '</section>');
  }

  // ---------- סיום המשחק ----------
  var gameEnded = false, pollTimer = null, overDismissed = false;
  function showEnded(g){
    var me = S && g.winner_table != null && S.table_no === g.winner_table;
    if (me) return;                                  // הקבוצה המנצחת רואה מסך משלה
    var who = "שולחן " + g.winner_table + (g.winner_name ? " (" + esc(g.winner_name) + ")" : "");
    var b = $("endBanner");
    b.innerHTML = "המשחק נגמר! " + who + " מצאו את התיבה.";
    b.classList.remove("hidden");
    if (!overDismissed) {
      var o = $("over");
      o.innerHTML = '<div class="card"><h1>המשחק נגמר!</h1>' +
        '<p>' + who + ' מצאו את התיבה ופתחו אותה.</p>' +
        '<p>אין צורך להמשיך לחפש. תודה ששיחקתם, נתראה בחופה!</p>' +
        '<button class="btn" id="overOk" type="button">הבנתי</button></div>';
      o.classList.remove("hidden");
      $("overOk").onclick = function () { overDismissed = true; o.classList.add("hidden"); o.innerHTML = ""; };
    }
  }
  function checkGame(){
    if (gameEnded || !BASE) return;
    rpc("get_game_status", {}).then(function (g) {
      if (g && g.ended) { gameEnded = true; clearInterval(pollTimer); showEnded(g); }
    }).catch(function () {});
  }
  function startPolling(){
    checkGame();
    if (!pollTimer) pollTimer = setInterval(function () { if (!document.hidden) checkGame(); }, POLL_MS);
  }

  // ---------- סריקת הברקוד שבתוך התיבה ----------
  function renderWinner(r){
    var first = r.first || r.mine;
    show(
      '<section class="card">' +
        (first
          ? '<h1>כל הכבוד, ניצחתם!</h1><p>הקבוצה שלכם הייתה הראשונה לפתוח את התיבה. המשחק הסתיים, והפרס השווה במיוחד מחכה לכם.</p>'
          : '<h1>כמעט!</h1><p>שולחן ' + esc(r.winner_table) + (r.winner_name ? ' (' + esc(r.winner_name) + ')' : '') + ' כבר פתחו את התיבה לפניכם. המשחק הסתיים, ותודה ששיחקתם!</p>') +
      '</section>');
  }
  function winnerFlow(){
    call("declare_winner", { p_code: WCODE }).then(function (r) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      WCODE = ""; gameEnded = true; clearInterval(pollTimer);
      return call("get_state", {}).then(function (st) { S = st; header(); renderWinner(r); });
    }).catch(function (e) {
      if (e && e.code === "unauthorized") { saveAuth(null); auth = null; S = null; view = null; render(); return; }
      header();
      if (e && e.code === "locked") show('<section class="card"><h1>עוד לא הגעתם לשלב הזה</h1><p>השלימו קודם את המשימות. את הברקוד הזה סורקים רק אחרי שפותחים את התיבה.</p><button class="btn" id="back" type="button">חזרה למשימה שלי</button></section>');
      else if (e && e.code === "bad_code") show('<section class="card"><h1>הקוד לא תקין</h1><p>נסו לסרוק שוב את הברקוד שבתוך התיבה.</p></section>');
      else show('<section class="card"><h1>אין חיבור</h1><p>בדקו את החיבור לאינטרנט ונסו לסרוק שוב.</p></section>');
      var bk = $("back"); if (bk) bk.onclick = function () { WCODE = ""; try { history.replaceState(null, "", location.pathname); } catch (x) {} view = null; render(); };
    });
  }

  // ---------- אתחול ----------
  function start(){
    if (!BASE || !KEY) {
      show('<section class="card"><h1>האתר עדיין לא מחובר</h1><p>חסרים פרטי חיבור בקובץ config.js.</p></section>');
      return;
    }
    show('<section class="card"><p class="muted">טוענים…</p></section>');
    auth = loadAuth();
    if (!auth) {
      if (WCODE) { show('<section class="card"><h1>סורקים עם הטלפון של הקבוצה</h1><p>כדי לסגור את המשחק, סרקו את הברקוד עם אותו טלפון (ואותה אפליקציה) שבהם שיחקתם לאורך המשחק.</p></section>'); return; }
      if (SCAN) { renderNeedsStart(); return; }
      view = null; render(); startPolling(); return;
    }
    if (WCODE) { startPolling(); winnerFlow(); return; }
    var p = SCAN ? call("scan_siblings", {}) : call("get_state", {}).then(function (s) { return { state: s, status: "state" }; });
    p.then(function (r) {
      S = r.state;
      if (SCAN) { try { history.replaceState(null, "", location.pathname); } catch (e) {} SCAN = false; }
      if (r.status === "too_early") { header(); renderTooEarly(); startPolling(); return; }
      render(); startPolling();
    }).catch(function (e) {
      if (e && e.code === "unauthorized") { saveAuth(null); auth = null; S = null; view = null; render(); return; }
      show('<section class="card"><h1>אין חיבור</h1><p>לא הצלחנו להתחבר לשרת. בדקו את החיבור לאינטרנט ונסו שוב.</p>' +
           '<button class="btn" id="retry" type="button">נסו שוב</button></section>');
      $("retry").onclick = start;
    });
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && auth && S && !view && !$("lb").innerHTML) {
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;   // לא להפריע להקלדה
      if (S.stage === 4 && pick.blob) return;                   // לא לאבד תמונה שנבחרה
      refresh();
    }
  });
  start();
})();
</script>
</body>
</html>
